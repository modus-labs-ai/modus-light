    <text x="812" y="29" fill="#2dd4bf" class="tag">Sovereign Mesh</text>
  </g>

  <!-- Footer Watermark -->
  <g transform="translate(40, 660)">
    <text x="0" y="16" class="box-desc" fill="#64748b">Modus Zen OS v1.0 Enterprise · Certified Zero-Symlink Invariant · BSL 1.1 Commercial Software License</text>
    <text x="920" y="16" class="box-desc" fill="#64748b" text-anchor="end">fleet_audit_engine 24/24 PASS · adversarial_wave1-7 68/68 PASS</text>
  </g>
</svg>
