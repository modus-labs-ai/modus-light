name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Without this block GITHUB_TOKEN takes the repository
# default, which on a public repo can be write — more authority than a test run needs,
# and the first thing a buyer's security questionnaire asks about.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m flake8 src tests examples

      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      # These three are what a customer runs in their first five minutes.
      # They are not covered by the unit suite on their own, so they gate CI too.
      - name: CLI demo
        run: modus-light demo

      - name: CLI benchmark
        run: modus-light benchmark

      - name: CLI audit
        run: modus-light audit

      - name: Audit under python -O (asserts stripped)
        run: python -O -m modus_light.cli audit

      - name: Example scripts
        run: |
          for f in examples/*.py; do
            echo "--- $f"
            python "$f"
          done

      # Run again with asserts stripped. An `assert some_call()` would otherwise
      # vanish entirely under -O, skipping the call while the success line still prints.
      - name: Example scripts under python -O (asserts stripped)
        run: |
          for f in examples/*.py; do
            echo "--- -O $f"
            python -O "$f"
          done

  package:
    name: Build and install from a wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      # Proves the published artifact works for someone who never clones the repo.
      - name: Install the wheel in a clean environment and run the demo
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/modus-light demo
          /tmp/fresh/bin/modus-light benchmark
